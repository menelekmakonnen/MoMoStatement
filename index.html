<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta -->
    <title>MoMo Statement — Your Mobile Money, Finally in Order</title>
    <meta name="description" content="Turn your MTN MoMo, Telecel Cash, and AirtelTigo messages into professional financial statements — instantly, privately, on your phone." />
    <meta name="keywords" content="mobile money, MoMo, MTN, Telecel, AirtelTigo, Ghana, financial statement, SMS parser, cash flow, fintech" />
    <meta name="author" content="ICUNI Connect" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="MoMo Statement — Your Mobile Money, Finally in Order" />
    <meta property="og:description" content="Turn your Mobile Money messages into professional financial statements. Works with MTN MoMo, Telecel Cash, and AirtelTigo Money." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://momo.icuni.org" />
    <meta property="og:site_name" content="MoMo Statement by ICUNI Connect" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MoMo Statement — Your Mobile Money, Finally in Order" />
    <meta name="twitter:description" content="Turn your Mobile Money messages into professional financial statements. Works with MTN MoMo, Telecel Cash, and AirtelTigo." />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="no-transitions">
    <div id="root">
      <!-- Inline critical loading skeleton — renders before JS hydrates -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:#141414;color:#F3F4F6;font-family:Inter,system-ui,sans-serif;">
        <svg width="48" height="48" viewBox="0 0 32 32" style="margin-bottom:16px;">
          <rect width="32" height="32" rx="6" fill="#1E1E1E"/>
          <text x="16" y="22" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#D4A847" text-anchor="middle">M</text>
        </svg>
        <div style="width:200px;height:4px;background:#1E1E1E;border-radius:9999px;overflow:hidden;">
          <div style="width:60%;height:100%;background:linear-gradient(90deg,#D4A847,#ad7a28);border-radius:9999px;animation:loadSlide 1.2s ease infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes loadSlide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove no-transitions class after initial paint to enable animations
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.classList.remove('no-transitions');
        });
      });
    </script>
  </body>
</html>
